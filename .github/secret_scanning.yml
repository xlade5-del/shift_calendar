# GitHub Secret Scanning Configuration
# Firebase client-side config files are safe to commit
# Security is enforced via Firestore Security Rules

paths-ignore:
  - 'android/app/google-services.json'
  - 'ios/Runner/GoogleService-Info.plist'
  - 'lib/firebase_options.dart'
  - 'firebase_options.dart'
  - 'landing_page/index.html'  # Landing page with public Firebase config
  - 'functions/verify-email-simple.js'  # Dev utility using Web API key
